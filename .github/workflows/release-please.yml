name: release-please

on:
  push:
    branches: [main]

# The default GITHUB_TOKEN may be read-only at org level; request what release-please needs.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Falls back to GITHUB_TOKEN when the PAT secret is not set.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
